name: CI

# すべてのブランチへの push で実行する(プルリクにも、そのコミットの結果が表示される)
on:
  push:
  workflow_dispatch:

# GITHUB_TOKEN の権限はリポジトリの読み取りだけにする
permissions:
  contents: read

# 同じブランチに続けて push したら、古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint / PHPUnit / カバレッジ80%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # DB はホストに公開した compose の db コンテナに繋ぐ
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      # ローカルと同じ MySQL 8.4(my.cnf の照合順序・タイムゾーン、init でテスト用DBを作成)
      - name: Start MySQL (docker compose の db)
        working-directory: .
        run: docker compose up -d --wait db

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, intl, bcmath, mbstring
          coverage: pcov
          ini-values: date.timezone=Asia/Tokyo, memory_limit=512M
          tools: composer:v2

      - name: Composer のキャッシュ場所を取得
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: .env の準備
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint(整形チェック)
        run: ./vendor/bin/pint --test

      - name: PHPUnit(app/ の行カバレッジ80%以上)
        run: php artisan test --coverage --min=80

      - name: 失敗時に Laravel のログを表示
        if: failure()
        run: cat storage/logs/*.log 2>/dev/null || true

  frontend:
    name: Frontend (ESLint / Prettier / build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier(整形チェック)
        run: npm run format:check

      - name: 型チェックとビルド
        run: npm run build
